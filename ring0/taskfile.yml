version: 3
vars:
  ts_suffix:
    sh: tailscale dns status | awk '/suffix =/ {gsub(")","");print $NF}'
  skopeo_opts: --dest-tls-verify=false --override-arch=amd64 --override-os=linux
tasks:
##
## Bootstrap
##
  intermediate-fullchain:
    desc: Deploy the PKI and creates the root CA
    preconditions:
      - sh: tailscale status >/dev/null 2>&1
        msg: Tailscale is not connected — run tailscale up first
      - sh: test -n "${BRIDGE_BOOTSTRAP_NAME:-}"
        msg: BRIDGE_BOOTSTRAP_NAME must be defined
      - sh: test -n "${PKI_BOOTSTRAP_SERVER_ADDR:-}"
        msg: PKI_BOOTSTRAP_SERVER_ADDR must be defined
      - sh: test -n "${PKI_BOOTSTRAP_SERVER_CIDR:-}"
        msg: PKI_BOOTSTRAP_SERVER_CIDR must be defined
      - sh: test -n "${PKI_COUNTRY:-}"
        msg: PKI_COUNTRY must be defined
      - sh: test -n "${PKI_LOCATION:-}"
        msg: PKI_LOCATION must be defined
      - sh: test -n "${PKI_ORG:-}"
        msg: PKI_ORG must be defined
      - sh: test -n "${PKI_ORG_UNIT:-}"
        msg: PKI_ORG_UNIT must be defined
      - sh: test -n "${PKI_STATE:-}"
        msg: PKI_STATE must be defined
    cmd: bash ./scripts/deploy-pki.sh
    generates: [dist/intermediate-fullchain.pem]

  bootstrap:
    desc: Deploy the bootstrap instance
    deps: [intermediate-fullchain]
    cmd: bash ./scripts/deploy-bootstrap.sh

  forge:
    desc: Deploy the forge instance
    cmd: bash ./scripts/deploy-forge.sh

##
## Platform
##
  management:
    desc: Deploy the management instance
    prompt:
    - You should read https://tailscale.com/kb/1236/kubernetes-operator. Is it OK?
    cmd: RING0_ROOT=$PWD bash ./scripts/deploy-management.sh

  flux:
    desc: Bootstrap FluxCD Operator and apply the FluxInstance (run after task management)
    preconditions:
      - sh: test -f dist/bundle.crt
        msg: "dist/bundle.crt missing — run task intermediate-fullchain first"
      - sh: test -f dist/openbao-approle-role-id
        msg: "dist/openbao-approle-role-id missing — run task intermediate-fullchain first"
      - sh: test -f dist/openbao-approle-secret-id
        msg: "dist/openbao-approle-secret-id missing — run task intermediate-fullchain first"
      - sh: test -f dist/openbao-eso-role-id
        msg: "dist/openbao-eso-role-id missing — run task intermediate-fullchain first"
      - sh: test -f dist/openbao-eso-secret-id
        msg: "dist/openbao-eso-secret-id missing — run task intermediate-fullchain first"
      - sh: test -n "${TS_OPERATOR_CLIENT_ID:-}"
        msg: TS_OPERATOR_CLIENT_ID must be defined
      - sh: test -n "${TS_OPERATOR_CLIENT_SECRET:-}"
        msg: TS_OPERATOR_CLIENT_SECRET must be defined
      - sh: test -n "${PKI_ENDPOINT:-}"
        msg: PKI_ENDPOINT must be defined
      - sh: test -n "${PKI_ORG:-}"
        msg: PKI_ORG must be defined
      - sh: test -n "${DNS_IP:-}"
        msg: DNS_IP must be defined
      - sh: test -n "${HOOKOS_IP:-}"
        msg: HOOKOS_IP must be defined
      - sh: test -n "${REGISTRY_IP:-}"
        msg: REGISTRY_IP must be defined
      - sh: test -n "${TINKERBELL_IP:-}"
        msg: TINKERBELL_IP must be defined
      - sh: test -n "${ARTIFACTS_FILE_SERVER:-}"
        msg: ARTIFACTS_FILE_SERVER must be defined
      - sh: test -n "${DHCP_BIND_INTERFACE:-}"
        msg: DHCP_BIND_INTERFACE must be defined
      - sh: test -n "${BOOTSTRAP_ENDPOINT:-}"
        msg: BOOTSTRAP_ENDPOINT must be defined
      - sh: test -n "${ANNOUNCEMENTS_IFACE:-}"
        msg: ANNOUNCEMENTS_IFACE must be defined
      - sh: test -n "${GHCR_TOKEN:-}"
        msg: GHCR_TOKEN must be defined (GitHub PAT or classic token with read:packages)
    cmd: >-
      RING0_ROOT=$PWD
      TS_SUFFIX={{.ts_suffix}}
      bash ./scripts/deploy-flux.sh

  idp:
    desc: Deploy the IDP Tailscale API gateway (Authentik itself is deployed by Flux)
    prompt: You should have a look at https://idp.{{.ts_suffix}}/if/flow/initial-setup/ for post-deployment configuration. Right?
    cmd: bash ./scripts/deploy-idp.sh

  cmdb:
    desc: Deploy the CMDB Tailscale API gateway (Netbox itself is deployed by Flux)
    cmd: bash ./scripts/deploy-cmdb.sh

  observability:
    desc: Deploy the Grafana Tailscale API gateway (VictoriaMetrics stack itself is deployed by Flux)
    cmd: bash ./scripts/deploy-observability.sh

  configure-oidc:
    desc: Configure OIDC auth on the management cluster's kube-apiserver using Authentik (run after task idp)
    preconditions:
      - sh: test -f dist/talosconfig
        msg: "dist/talosconfig missing — run task management first"
      - sh: test -n "${OIDC_CLIENT_ID:-}"
        msg: OIDC_CLIENT_ID must be defined
      - sh: test -n "${OIDC_SLUG:-}"
        msg: OIDC_SLUG must be defined
      - sh: test -n "${OIDC_GROUP:-}"
        msg: OIDC_GROUP must be defined
      - sh: test -n "${OIDC_CLUSTER_ROLE:-}"
        msg: OIDC_CLUSTER_ROLE must be defined
      - sh: kubectl get pods -n platform-management -l app.kubernetes.io/name=authentik --field-selector=status.phase=Running -o name | grep -q .
        msg: "Authentik is not running — run task idp first"
    cmd: RING0_ROOT=$PWD bash ./scripts/configure-oidc.sh

  bmaas:
    desc: Build and sync HookOS, populate the OCI registry, deploy CAPI (Zot/Tinkerbell/Kamaji are deployed by Flux)
    cmds:
      - bash ./scripts/deploy-bmaas.sh
      - task: install-coredns

  install-coredns:
    desc: Install CoreDNS with Netbox plugin into the BMaaS namespace
    deps: [push-coredns-oci]
    vars:
      coredns_version:
        sh: awk -F'"' '/version =/ { print $2; exit }' ./core-services/forge/coredns.nix
    preconditions:
      - sh: test -n "${BMAAS_NAMESPACE:-}"
        msg: BMAAS_NAMESPACE must be defined
      - sh: test -n "${DNS_IP:-}"
        msg: DNS_IP must be defined
      - sh: test -n "{{.ts_suffix}}"
        msg: ts_suffix could not be determined from tailscale dns status
      - sh: test -n "{{.coredns_version}}"
        msg: coredns version could not be determined from coredns.nix
    status:
      - kubectl get deployment --namespace "$BMAAS_NAMESPACE" coredns >/dev/null 2>&1
    cmds:
      - mkdir -p ./dist
      - |
        if [ -z "${COREDNS_NETBOX_TOKEN:-}" ]; then
          coredns_netbox_token="$(cat ./dist/coredns.token)"
        else
          coredns_netbox_token="$COREDNS_NETBOX_TOKEN"
        fi
        if ! echo -n "$coredns_netbox_token" | wc -c | awk '$1 == 40 {print "ok"}' | grep -q ok; then
          echo "No valid Netbox token found. '$coredns_netbox_token' is not 40-character long."
          exit 1
        fi
        jinja2 --strict \
          -D "namespace=$BMAAS_NAMESPACE" \
          -D "coredns_netbox_token=$coredns_netbox_token" \
          -D "coredns_ip=$DNS_IP" \
          -D "ts_suffix={{.ts_suffix}}" \
          -D "version=v{{.coredns_version}}" \
          ./core-services/management/manifests/05-coredns.yaml.j2 \
          -o ./dist/coredns.yaml
      - kubectl apply --wait --namespace "$BMAAS_NAMESPACE" -f ./dist/coredns.yaml

  add-worker:
    desc: Add a physical worker node to the management cluster via Matchbox PXE
    preconditions:
      - sh: test -f dist/worker.yaml
        msg: dist/worker.yaml missing — run task management first
      - sh: test -f dist/talosconfig
        msg: dist/talosconfig missing — run task management first
      - sh: which yq
        msg: yq is required (brew install yq / apt install yq)
      - sh: test -n "${WORKER_HOSTNAME:-}"
        msg: WORKER_HOSTNAME must be defined
      - sh: test -n "${WORKER_MAC:-}"
        msg: WORKER_MAC must be defined
      - sh: test -n "${GITOPS_ROOT:-}"
        msg: GITOPS_ROOT must be defined
      - sh: test -f "${GITOPS_ROOT}/ring0/workers/${WORKER_HOSTNAME}/patch.yaml"
        msg: "Per-machine patch not found: ${GITOPS_ROOT}/ring0/workers/${WORKER_HOSTNAME}/patch.yaml"
      - sh: test -n "${TALOS_FACTORY_URL:-}"
        msg: TALOS_FACTORY_URL must be defined
      - sh: test -n "${WORKER_TALOS_FACTORY_UUID:-}"
        msg: WORKER_TALOS_FACTORY_UUID must be defined
    cmd: RING0_ROOT=$PWD GITOPS_ROOT=$GITOPS_ROOT bash ./scripts/management/add-worker.sh

##
## Dangerous tasks
##
  destroy-management:
    desc: Destroy the management instance
    prompt:
      - This is a dangerous command... Do you want to continue?
      - Are you sure?
    cmds:
      - if incus list | grep -q management ; then incus delete -f management ; else echo management instance already deleted ; fi
      - rm -f dist/controlplane.yaml dist/worker.yaml dist/talosconfig dist/cp-patch.yaml dist/patch.yaml dist/authentik-values.yaml
      - kubectl config delete-context admin@management

  dist-clean:
    desc: Removes the distribution artifacts
    prompt:
      - This is a dangerous command... Do you want to continue?
      - Are you sure?
    dir: '{{.USER_WORKING_DIR}}/dist'
    cmd: rm -rf *

  smoke-test-kamaji:
    desc: Provision a throwaway TenantControlPlane to validate kamaji + kamaji-etcd bootstrap end to end
    cmd: RING0_ROOT=$PWD bash ./scripts/smoke-test-kamaji.sh

##
## Day 2 operations
##
  update-flatcar-repo:
    desc: Download the latest version of Flatcar Linux artifacts and set the current symlink
    cmd: cat ./core-services/bootstrap/update-flatcar-repo.sh | incus exec bootstrap bash --

  create-coredns-oci:
    desc: Build the CoreDNS OCI image (with Netbox plugin) on the forge instance
    vars:
      nix_file: ./core-services/forge/coredns.nix
      image_build_commands: nix-build /var/build/coredns.nix ; cat result > /var/build/coredns.tar.gz
    cmds:
      - mkdir -p ./dist
      - incus file push {{.nix_file}} forge/root/coredns.nix
      - incus exec forge -- docker pull nixos/nix
      - incus exec forge -- docker run --rm --privileged --volume /root:/var/build nixos/nix bash -c "{{.image_build_commands}}"
      - incus file pull forge/root/coredns.tar.gz ./dist/coredns.tar.gz
    generates:
      - ./dist/coredns.tar.gz
    status:
      - test -f ./dist/coredns.tar.gz
    sources:
      - ./core-services/forge/coredns.nix

  push-coredns-oci:
    desc: Push the CoreDNS OCI image to the internal registry
    preconditions:
      - sh: test -f ./dist/coredns.tar.gz
        msg: coredns.tar.gz not found — run create-coredns-oci first
    cmds:
      - |
        version=$(skopeo inspect docker-archive:./dist/coredns.tar.gz | jq -r ".Labels.version")
        skopeo copy {{.skopeo_opts}} docker-archive:./dist/coredns.tar.gz docker://registry.{{.ts_suffix}}:443/coredns:v$version

  update-coredns:
    desc: Update CoreDNS version and hashes in coredns.nix (requires VERSION env var)
    vars:
      nix_file: ./core-services/forge/coredns.nix
      fake_hash: sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      sed_cmd:
        sh: if [[ "$(uname)" == "Darwin" ]]; then echo gsed; else echo sed; fi
    preconditions:
      - sh: if [ -z $VERSION ]; then return 1 ; fi
        msg: VERSION must be set (e.g. export VERSION=1.14.0)
      - sh: |
          current=$(awk -F'"' '/version =/ { print $2; exit }' ./core-services/forge/coredns.nix)
          [ "$current" != "$VERSION" ]
        msg: VERSION $VERSION is already the current version in coredns.nix
    cmds:
      # 1. Bump version, reset both hashes to fakeHash to trigger mismatch errors
      - |
        {{.sed_cmd}} -i \
          -e 's/version = "[^"]*"/version = "'"$VERSION"'"/' \
          -e 's|sha256 = "sha256-[^"]*"|sha256 = "{{.fake_hash}}"|' \
          -e 's|vendorHash = "sha256-[^"]*"|vendorHash = "{{.fake_hash}}"|' \
          {{.nix_file}}
      # 2. Push coredns.nix to forge for first build pass
      - incus file push {{.nix_file}} forge/root/coredns.nix
      # 3. First pass: extract correct sha256 for the source tarball
      - |
        NEW_SHA256=$(incus exec forge -- \
          docker run --rm --privileged --volume /root:/var/build nixos/nix \
          bash -c "nix-build /var/build/coredns.nix 2>&1 || true" \
          | awk '/got:/ { print $NF; exit }')
        test -n "$NEW_SHA256" \
          || { echo "ERROR: could not extract sha256 from first build pass" >&2 ; exit 1 ; }
        {{.sed_cmd}} -i \
          -e 's|sha256 = "sha256-[^"]*"|sha256 = "'"$NEW_SHA256"'"|' \
          {{.nix_file}}
      # 4. Push updated coredns.nix for second build pass
      - incus file push {{.nix_file}} forge/root/coredns.nix
      # 5. Second pass: extract correct vendorHash for Go modules
      - |
        NEW_VENDOR_HASH=$(incus exec forge -- \
          docker run --rm --privileged --volume /root:/var/build nixos/nix \
          bash -c "nix-build /var/build/coredns.nix 2>&1 || true" \
          | awk '/got:/ { print $NF; exit }')
        test -n "$NEW_VENDOR_HASH" \
          || { echo "ERROR: could not extract vendorHash from second build pass" >&2 ; exit 1 ; }
        {{.sed_cmd}} -i \
          -e 's|vendorHash = "sha256-[^"]*"|vendorHash = "'"$NEW_VENDOR_HASH"'"|' \
          {{.nix_file}}