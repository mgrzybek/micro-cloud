# authentik-secret must exist before reconciliation.
# task flux creates it with a random secret_key (generated once, stored in dist/).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: idp
  namespace: platform-management
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: authentik-secret
      valuesKey: secret_key
      targetPath: authentik.secret_key
    - kind: ConfigMap
      name: cluster-config
      valuesKey: ts_suffix
      targetPath: server.ingress.hosts[0]
      # Flux does not support string templating; the ingress host is patched by task flux:
      # kubectl create configmap cluster-config ... --from-literal=idp_hostname=idp.<ts_suffix>
  values:
    authentik:
      error_reporting:
        enabled: true
    server:
      ingress:
        enabled: true
        hosts: []
      # Deploy the metrics service + ServiceMonitor so the VictoriaMetrics
      # operator discovers the authentik server metrics.
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    worker:
      # Same for the authentik worker.
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    postgresql:
      enabled: false
    redis:
      enabled: true
    global:
      env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: tooling-rw
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: app
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: tooling-app
              key: password
