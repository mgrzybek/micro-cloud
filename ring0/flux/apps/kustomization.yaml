apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# external-secrets lives in infrastructure/04-eso: Flux dry-runs a Kustomization
# as a whole, so the operator cannot install its external-secrets.io CRDs in the
# same set as the ExternalSecret resources consumed below.
resources:
  - 03-idp
  - 04-cmdb
  - 05-bmaas
  - 05-storage
  - 06-observability
