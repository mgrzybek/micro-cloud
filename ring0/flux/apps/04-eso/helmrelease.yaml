apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    # Let the VictoriaMetrics operator discover the External Secrets metrics.
    # renderMode defaults to skipIfMissing, so this is a no-op until the
    # monitoring.coreos.com CRDs are present (installed as infrastructure).
    serviceMonitor:
      enabled: true
