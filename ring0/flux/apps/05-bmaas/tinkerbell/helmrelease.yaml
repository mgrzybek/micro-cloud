# cluster-config ConfigMap keys used here (created by task flux):
#   dhcp_bind_interface, bootstrap_endpoint, hookos_ip, tinkerbell_ip,
#   artifacts_file_server, registry_ip
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinkerbell
  namespace: tinkerbell-system
spec:
  interval: 1h
  chart:
    spec:
      chart: tinkerbell
      version: "v0.19.1"
      sourceRef:
        kind: HelmRepository
        name: tinkerbell
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: cluster-config
      valuesKey: dhcp_bind_interface
      targetPath: deployment.envs.smee.dhcpBindInterface
    - kind: ConfigMap
      name: cluster-config
      valuesKey: bootstrap_endpoint
      targetPath: optional.hookos.downloadURL
    - kind: ConfigMap
      name: cluster-config
      valuesKey: hookos_ip
      targetPath: optional.hookos.service.annotations.io\.cilium/lb-ipam-ips
    - kind: ConfigMap
      name: cluster-config
      valuesKey: tinkerbell_ip
      targetPath: service.annotations.io\.cilium/lb-ipam-ips
    - kind: ConfigMap
      name: cluster-config
      valuesKey: tinkerbell_ip
      targetPath: publicIP
    - kind: ConfigMap
      name: cluster-config
      valuesKey: artifacts_file_server
      targetPath: artifactsFileServer
  values:
    deployment:
      agentImage: registry.ring0:5000/tinkerbell/tink-agent
      hostNetwork: true
      image: ghcr.io/tinkerbell/tinkerbell
      # dhcp_bind_interface (enp7s0) only exists on the "management" node —
      # "management-1" has different physical NICs, so smee crashloops
      # ("cannot bind to interface enp7s0: no such device") if scheduled
      # there. Pin to the node that owns the bootstrap VLAN interface.
      nodeSelector:
        kubernetes.io/hostname: management
      # hostNetwork + single-node nodeSelector means the new pod can never
      # schedule during a RollingUpdate (host ports still held by the old
      # pod on the same node), so the rollout deadlocks until timeout.
      # rollingUpdate must be explicitly nulled out: Helm deep-merges values,
      # so the chart's default strategy.rollingUpdate otherwise survives
      # alongside type: Recreate, which the Deployment API rejects.
      strategy:
        type: Recreate
        rollingUpdate: null
      envs:
        globals:
          enableRufioController: false
          enableSecondstar: false
        smee:
          ipxeHttpScriptExtraKernelArgs:
            - console=ttyS0
            - insecure_registries=registry.ring0:5000
        tinkController:
          enableLeaderElection: false
      tinkServer:
        autoDiscoveryAutoEnrollmentEnabled: true
        autoDiscoveryEnabled: true
    optional:
      hookos:
        hostNetwork: false
        arch: x86_64
        kernelVersion: both
        # Pinned to the same node as the local-path PVC backing its storage.
        nodeSelector:
          kubernetes.io/hostname: management
        service:
          labels:
            ring0/services: "true"
          lbClass:
      kubevip:
        enabled: false
    service:
      labels:
        ring0/services: "true"
      lbClass:
