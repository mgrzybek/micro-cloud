apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kamaji
  namespace: kamaji-system
spec:
  interval: 1h
  chart:
    spec:
      chart: kamaji
      sourceRef:
        kind: HelmRepository
        name: clastix
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    etcd:
      deploy: true
      # No StorageClass is marked default on this cluster; pin explicitly.
      persistence:
        storageClassName: local-path
