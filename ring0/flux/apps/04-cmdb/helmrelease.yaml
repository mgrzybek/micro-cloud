# cmdb-netbox-remote-auth secret must exist before reconciliation.
# task flux creates it by rendering netbox-remote-auth.py.j2 with the Authentik OAuth credentials.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cmdb
  namespace: platform-management
spec:
  interval: 1h
  # NetBox 4.7 takes ~5 min to become ready (image pull + Django migrations +
  # startupProbe on /login/): the 5m default timeout aborts a healthy upgrade.
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  chart:
    spec:
      chart: netbox
      # Pinned to a single minor: bump deliberately after reading the release notes.
      version: 8.3.x
      sourceRef:
        kind: HelmRepository
        name: netbox-community
        namespace: flux-system
  values:
    defaultLanguage: fr-fr
    # Enable the NetBox /metrics endpoint and let the VictoriaMetrics operator
    # discover it through a ServiceMonitor.
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    # Shared between the netbox and netbox-worker pods: needs RWX, so NFS rather
    # than the default iSCSI class, which only attaches to a single node.
    persistence:
      storageClass: truenas-nfs
      accessMode: ReadWriteMany
    postgresql:
      enabled: false
    externalDatabase:
      existingSecretName: tooling-app
      existingSecretKey: password
      host: tooling-rw
      port: 5432
      username: app
      database: netbox
    valkey:
      architecture: standalone
    extraConfig:
      - secret:
          secretName: cmdb-netbox-remote-auth
          items:
            - key: netbox-remote-auth.py
              path: netbox-remote-auth.py
        optional: false
    # sso-pipeline-roles ConfigMap is managed by Kustomize (sso-pipeline-roles.yaml),
    # not via extraDeploy, so it can be read and maintained as a normal YAML file.
    extraVolumes:
      - name: remote-auth
        secret:
          secretName: cmdb-netbox-remote-auth
      - name: sso-pipeline-roles
        configMap:
          name: cmdb-netbox-sso-pipeline-roles
          defaultMode: 0755
      - name: internal-ca-chain
        configMap:
          name: internal-ca-chain
    extraVolumeMounts:
      - name: remote-auth
        mountPath: /etc/netbox/config/extra.py
        subPath: netbox-remote-auth.py
        readOnly: true
      - name: sso-pipeline-roles
        mountPath: /opt/netbox/netbox/netbox/custom_pipeline.py
        subPath: sso_pipeline_roles.py
        readOnly: true
      - name: internal-ca-chain
        mountPath: /usr/share/ca-certificates/
        readOnly: true
    extraEnvs:
      - name: REQUESTS_CA_BUNDLE
        value: /usr/share/ca-certificates/internal-ca.crt
