# NOT managed by Flux (excluded from kustomization.yaml): datasetPath depends
# on TRUENAS_POOL, resolved only at deploy time. task flux creates the real
# StorageClass imperatively — see ring0/scripts/deploy-flux.sh. This file
# documents the expected shape.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-nfs
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  datasetPath: "pool1/csi/nfs"
  compression: "LZ4"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
