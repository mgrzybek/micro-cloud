# NOT managed by Flux (excluded from kustomization.yaml): datasetPath depends
# on TRUENAS_POOL, resolved only at deploy time. task flux creates the real
# StorageClasses imperatively — see ring0/scripts/deploy-flux.sh. This file
# documents the expected shapes.
#
# datasetPath is the parent path RELATIVE to the pool (v1.1+ schema): no pool
# prefix, no leading/trailing slash. Volumes land at <pool>/<datasetPath>/<pvc>.
#
# truenas-nfs   — file storage over NFS (RWX capable). Default for general PVCs.
# truenas-iscsi — block storage over iSCSI. Required by databases and by
#                 VictoriaMetrics (which does not support NFS). Needs the
#                 siderolabs/iscsi-tools Talos extension on the nodes and the
#                 iSCSI service enabled on the TrueNAS appliance.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-nfs
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  datasetPath: "csi"
  compression: "LZ4"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-iscsi
provisioner: csi.truenas.io
parameters:
  protocol: "iscsi"
  datasetPath: "csi/iscsi"
  compression: "LZ4"
  csi.storage.k8s.io/fstype: "ext4"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
