# API key stored in OpenBao at secret/truenas-csi (key: api-key).
# The eso AppRole used by the ClusterSecretStore is read-only: push the
# secret using the root token instead, from inside the pki Incus instance
# (see core-services/pki/README.md#openbao):
#   bao kv put secret/truenas-csi api-key=...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-api-credentials
  namespace: truenas-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: truenas-api-credentials
  data:
    - secretKey: api-key
      remoteRef:
        key: truenas-csi
        property: api-key
