# API key stored in OpenBao at secret/truenas-csi (key: api-key).
# Push it once with (through the openbao-eso AppRole path used by the
# ClusterSecretStore, e.g. via `bao kv put secret/truenas-csi api-key=...`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-api-credentials
  namespace: truenas-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: truenas-api-credentials
  data:
    - secretKey: api-key
      remoteRef:
        key: truenas-csi
        property: api-key
