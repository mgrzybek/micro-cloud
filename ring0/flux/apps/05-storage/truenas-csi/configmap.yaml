# NOT managed by Flux (excluded from kustomization.yaml): truenasURL and
# nfsServer depend on ts_suffix, resolved only at deploy time. task flux
# creates the real ConfigMap imperatively from TS_SUFFIX/TRUENAS_HOSTNAME/
# TRUENAS_POOL — see ring0/scripts/deploy-flux.sh. This file documents the
# expected shape.
apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-csi-config
  namespace: truenas-csi
data:
  truenasURL: "wss://stockage.<ts_suffix>/api/current"
  truenasInsecure: "true" # TrueNAS UI uses a self-signed cert in this homelab
  # defaultPool is the ZFS pool NAME only (v1.1+ schema). The parent dataset
  # path lives in the StorageClass datasetPath, relative to this pool.
  defaultPool: "pool1"
  nfsServer: "stockage.<ts_suffix>"
  # iscsiPortal backs the truenas-iscsi StorageClass. Requires the iSCSI service
  # enabled on the TrueNAS appliance and the siderolabs/iscsi-tools extension on
  # the Talos nodes.
  #
  # It MUST be an IP address, not a DNS name: csi-lib-iscsi builds the expected
  # /dev/disk/by-path/ip-<portal>-... device string from the portal literal, but
  # udev names that symlink with the resolved IP. A DNS-name portal never matches,
  # so NodeStageVolume fails with "failed to find device path". deploy-flux.sh
  # resolves the TrueNAS Tailscale IP (`tailscale ip -4 $TRUENAS_HOSTNAME`).
  iscsiPortal: "100.107.133.46:3260"
