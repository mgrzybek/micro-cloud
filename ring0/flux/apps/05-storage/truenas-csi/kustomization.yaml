apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - csidriver.yaml
  - externalsecret.yaml
  - controller-deployment.yaml
  - node-daemonset.yaml
  - storageclass.yaml
  - volumesnapshotclass.yaml
  # configmap.yaml is NOT managed by Flux: it holds ts_suffix-dependent
