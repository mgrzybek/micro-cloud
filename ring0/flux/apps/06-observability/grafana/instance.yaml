# Grafana instance managed by the grafana-operator. State lives in SQLite on the
# grafana-data PVC, so the Deployment uses the Recreate strategy: SQLite cannot
# be shared by two pods on the same volume.
#
# ${AUTH_CLIENT_ID}, ${AUTH_CLIENT_SECRET}, ${IDP_URL} and ${ROOT_URL} are
# resolved by Grafana itself from the container environment (env provider, see
# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/), fed
# by the grafana-oauth Secret produced by the ExternalSecret.
#
# The internal-ca-chain ConfigMap (created by task flux) must exist before
# reconciliation: idp.<ts_suffix> serves a certificate signed by the internal CA.
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    dashboards: "grafana"
spec:
  config:
    log:
      mode: "console"
    server:
      root_url: ${ROOT_URL}
      serve_from_sub_path: "false"
    database:
      type: sqlite3
      path: grafana.db
    auth:
      disable_login_form: "false"
    auth.generic_oauth:
      enabled: "true"
      name: "Authentik"
      allow_sign_up: "true"
      client_id: ${AUTH_CLIENT_ID}
      client_secret: ${AUTH_CLIENT_SECRET}
      scopes: "openid email profile"
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      groups_attribute_path: groups
      # Authentik serves these endpoints at /application/o/, not under the
      # application slug (only the issuer and the discovery document are).
      auth_url: ${IDP_URL}/application/o/authorize/
      token_url: ${IDP_URL}/application/o/token/
      api_url: ${IDP_URL}/application/o/userinfo/
      # Scoped to the OAuth client on purpose: SSL_CERT_FILE would replace the
      # public roots of the container.
      tls_client_ca: /etc/grafana/ca/internal-ca.crt
      role_attribute_path: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          securityContext:
            fsGroup: 472
            supplementalGroups:
              - 0
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-data
            - name: internal-ca-chain
              configMap:
                name: internal-ca-chain
          containers:
            # No image pinned on purpose: the operator tracks the Grafana
            # version matching its own release.
            - name: grafana
              volumeMounts:
                - name: grafana-data
                  mountPath: /var/lib/grafana
                - name: internal-ca-chain
                  mountPath: /etc/grafana/ca
                  readOnly: true
              env:
                - name: AUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth
                      key: client-id
                - name: AUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth
                      key: client-secret
                - name: IDP_URL
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth
                      key: idp-url
                - name: ROOT_URL
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth
                      key: root-url
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 256Mi
