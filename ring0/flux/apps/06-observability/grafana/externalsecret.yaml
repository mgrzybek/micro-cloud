# OIDC credentials and endpoints for the Grafana <-> Authentik integration,
# stored in OpenBao at secret/grafana. idp-url and root-url are kept there
# rather than in Git because both embed the dynamic ts_suffix.
#
# The eso AppRole used by the ClusterSecretStore is read-only: push the secret
# using the root token instead, from inside the pki Incus instance
# (see core-services/pki/README.md#openbao):
#   bao kv put secret/grafana \
#     client-id=... client-secret=... \
#     idp-url=https://idp.<ts_suffix> \
#     root-url=https://grafana.<ts_suffix>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-oauth
  data:
    - secretKey: client-id
      remoteRef:
        key: grafana
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: grafana
        property: client-secret
    - secretKey: idp-url
      remoteRef:
        key: grafana
        property: idp-url
    - secretKey: root-url
      remoteRef:
        key: grafana
        property: root-url
