apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The grafana-operator HelmRelease lives in infrastructure/04-grafana-operator:
# Flux dry-runs a Kustomization as a whole, so the operator cannot install its
# grafana.integreatly.org CRDs in the same set as the CRs consuming them below.
resources:
  - externalsecret.yaml
  - pvc.yaml
  - instance.yaml
  - datasource.yaml
