apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana-operator
      version: 5.25.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    crds:
      immutable: false
