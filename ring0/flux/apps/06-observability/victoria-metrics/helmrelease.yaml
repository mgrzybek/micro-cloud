# Metrics-only observability stack (VictoriaMetrics). Logs (VictoriaLogs) and
# traces (VictoriaTraces) are intentionally out of scope for this iteration.
# Alerting (vmalert + alertmanager) is disabled for now.
# Grafana is NOT deployed by this chart: it is managed by the official
# grafana-operator (see the grafana/ kustomization), with its state in SQLite
# on a truenas-iscsi PVC — hence grafana.enabled: false here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  values:
    # Single-node TSDB persisted on the TrueNAS CSI over iSCSI (block storage:
    # VictoriaMetrics does not support NFS). Snapshottable via the
    # truenas-snapclass VolumeSnapshotClass for backups.
    vmsingle:
      spec:
        retentionPeriod: "30d"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: truenas-iscsi
          resources:
            requests:
              storage: 20Gi
    vmagent:
      spec:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
    # No alerting this iteration.
    vmalert:
      enabled: false
    alertmanager:
      enabled: false
    # Operator and metrics sources — bounded on this small, memory-tight cluster.
    victoria-metrics-operator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    kube-state-metrics:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    prometheus-node-exporter:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
    # Deployed by the grafana-operator instead (grafana/ kustomization).
    grafana:
      enabled: false
