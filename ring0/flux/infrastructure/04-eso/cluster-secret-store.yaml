# openbao-eso-approle secret must exist before this reconciles.
# task flux creates it from dist/openbao-eso-role-id and dist/openbao-eso-secret-id.
#
# pki_endpoint and openbao_ca_bundle are read from cluster-config ConfigMap by task flux
# and written into this manifest via a post-render patch OR set directly at bootstrap.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: ""
      path: "secret"
      version: "v2"
      caBundle: ""
      auth:
        appRole:
          path: approle
          roleId: ""
          secretRef:
            namespace: external-secrets
            name: openbao-eso-approle
            key: secretId
