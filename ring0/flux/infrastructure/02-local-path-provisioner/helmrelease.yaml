apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: local-path-provisioner
      version: "0.0.32"
      sourceRef:
        kind: HelmRepository
        name: rancher
        namespace: flux-system
  values:
    storageClass:
      defaultClass: true
