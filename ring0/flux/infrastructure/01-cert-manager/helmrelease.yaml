apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  # servicemonitor below requires the monitoring.coreos.com CRDs.
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    extraArgs:
      - --enable-gateway-api
    # Let the VictoriaMetrics operator discover cert-manager metrics.
    # prometheus.enabled defaults to true; podmonitor and servicemonitor are
    # mutually exclusive, so only the ServiceMonitor is turned on here.
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
