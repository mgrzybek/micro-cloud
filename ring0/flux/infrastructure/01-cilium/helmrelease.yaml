apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  # ServiceMonitor resources below require the monitoring.coreos.com CRDs.
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: cluster-config
      valuesKey: announcements_iface
      targetPath: l2announcements.interface
    - kind: ConfigMap
      name: cluster-config
      valuesKey: management_hostname
      targetPath: k8sServiceHost
  values:
    cluster:
      name: management
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    gatewayAPI:
      enabled: true
      hostNetwork:
        enabled: false
    envoy:
      securityContext:
        capabilities:
          keepCapNetBindService: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    ipam:
      mode: kubernetes
    # Expose Prometheus metrics and let the VictoriaMetrics operator discover
    # them by creating ServiceMonitors for every Cilium component.
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    hubble:
      relay:
        enabled: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2
        serviceMonitor:
          enabled: true
      ui:
        enabled: true
        service:
          annotations:
            tailscale.com/expose: "true"
            tailscale.com/hostname: hubble
    k8sServicePort: 6443
    kubeProxyReplacement: true
    routingMode: tunnel
    tunnelProtocol: vxlan
    externalIPs:
      enabled: true
    l7Proxy: true
    l2announcements:
      enabled: true
      leaseDuration: 3s
      leaseRenewDeadline: 1s
      leaseRetryPeriod: 500ms
    k8sClientRateLimit:
      qps: 5
      burst: 10
