# Gateway API CRDs required by Cilium — version must match install-platform-management.sh
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 24h
  path: ./ring0/flux/infrastructure/01-cilium/gateway-api
  prune: false
  sourceRef:
    kind: OCIRepository
    name: flux
  wait: true
  timeout: 5m
