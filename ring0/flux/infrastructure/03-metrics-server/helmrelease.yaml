apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  values:
    # Talos kubelet serving certs are self-signed unless server cert rotation is
    # enabled; --kubelet-insecure-tls lets metrics-server scrape them. Drop this
    # arg if the cluster is configured with signed kubelet serving certificates.
    args:
      - --kubelet-insecure-tls
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
