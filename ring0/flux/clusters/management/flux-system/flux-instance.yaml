apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  storage:
    class: local-path
    size: 10Gi
  cluster:
    type: kubernetes
  sync:
    kind: OCIRepository
    url: oci://ghcr.io/mgrzybek/micro-cloud
    # ref: latest picks up every new tag automatically — acceptable for a homelab.
    # Pin to a specific version (e.g. ref: v1.2.3) to prevent unintended upgrades.
    ref: latest
    path: ./ring0/flux/clusters/management
    pullSecret: ghcr-auth
