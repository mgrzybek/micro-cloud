name: Release OCI artifact
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write # create the GitHub Release
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and all tags to build the notes.
          fetch-depth: 0
      - name: Install Flux CLI
        uses: fluxcd/flux2/action@v2.9.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create temporary directory
        run: |
          mkdir -p /tmp/verify
      - name: Push ring0 Flux manifests as OCI artifact
        run: |
          flux push artifact \
            "oci://ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            --path=. \
            --source="${{ github.repositoryUrl }}" \
            --revision="${{ github.ref_name }}@sha1:${{ github.sha }}"
      - name: Tag artifact as latest
        run: |
          flux tag artifact \
            "oci://ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            --tag latest
      - name: Verify artifact
        run: |
          flux pull artifact \
            "oci://ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            --output /tmp/verify
      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.git-cliff.outputs.content }}
