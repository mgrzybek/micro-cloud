name: Release OCI artifact
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write # create the GitHub Release
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # git-cliff needs the full history and all tags to build the notes.
          fetch-depth: 0
      - name: Install Flux CLI
        uses: fluxcd/flux2/action@dcc7def046cba2fe8d15d9737a4c250100f62fe0 # v2.9.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create temporary directory
        run: |
          mkdir -p /tmp/verify
      - name: Push ring0 Flux manifests as OCI artifact
        run: |
          flux push artifact \
            "oci://ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            --path=. \
            --source="${{ github.repositoryUrl }}" \
            --revision="${{ github.ref_name }}@sha1:${{ github.sha }}"
      - name: Tag artifact as latest
        run: |
          flux tag artifact \
            "oci://ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            --tag latest
      - name: Verify artifact
        run: |
          flux pull artifact \
            "oci://ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            --output /tmp/verify
      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          # Mark tags carrying a SemVer pre-release suffix (e.g. v0.1.0-rc.1) as
          # a GitHub pre-release; final vX.Y.Z tags become full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
